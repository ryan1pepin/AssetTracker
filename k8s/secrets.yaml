# Note: These are dev-only default credentials for local k8s deployment.
# For production, use your own secrets manager or generate unique passwords.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  username: asset_user
  password: asset_password
  database: asset_tracker
  connection-uri: "postgresql+asyncpg://asset_user:asset_password@postgres:5432/asset_tracker"
--- 
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
type: Opaque
stringData:
  root-password: rootpassword
  connection-uri: "mongodb://root:rootpassword@mongo:27017"
