apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: asset-tracker-backend:v6
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection-uri
        - name: MONGO_URL
          valueFrom:
            secretKeyRef:
              name: mongo-credentials
              key: connection-uri
        - name: POLL_INTERVAL
          value: "15.0"
        - name: ENABLE_SPIKES
          value: "true"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
